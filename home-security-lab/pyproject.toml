[project]
name = "home-security-lab"
version = "0.1.0"
description = "Docker home lab: log shipping to Elasticsearch, Sigma detections, local-LLM alert triage"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
